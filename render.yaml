# Render Blueprint for Bujjigadu Subtitle Studio
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bujjigadu-subtitle-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
    autoDeploy: true

